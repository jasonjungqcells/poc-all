name: ieee1547_cat3_ride_through
extends: base_residential
description: >
  Category III: maximum ride-through, widened by IEEE 1547a-2020. The same
  sub-second excursion that trips Category I is survived here with no
  interruption at all.
tags: [grid, ieee1547, ride-through, standards]
controls:
  # Ride-through thresholds are sub-second, so the tick must be finer than
  # the default 1 s or the excursion cannot be resolved at all.
  sim.tick_ms: 50
  grid.ieee1547.abnormal_category: III
timeline:
  - at: 30s
    set: { plant.grid.voltage_v: 200 }
  - at: 30500ms
    set: { plant.grid.voltage_v: 240 }
    note: 500 ms excursion -- longer than Category I tolerates, shorter than Category III
